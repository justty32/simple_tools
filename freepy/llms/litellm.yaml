# litellm.yaml
# LiteLLM Proxy 設定檔
#
# 這份設定檔定義了三種來源的模型：
#   1. DeepSeek 雲端 API（需要 DEEPSEEK_API_KEY）
#   2. 遠端 Ollama @ 192.168.1.146（不需要金鑰，只有在那台機器連得到時才會通）
#   3. 本機 LM Studio（不需要真實金鑰，走 OpenAI 相容端點）
#
# 連不到的來源不會影響 proxy 啟動，只有真的去呼叫它時才會失敗。
# 啟動方式請參考同目錄下的 start_litellm.sh / start_litellm.ps1。

model_list:
  # ---------------------------------------------------------------------
  # DeepSeek 雲端 API
  # 2026-08-05 實際的 /models 只有 deepseek-v4-flash 和 deepseek-v4-pro；
  # deepseek-chat / deepseek-reasoner 是舊名字，現在分別對應到 v4-flash 的
  # 非思考模式和思考模式，官方仍然收，所以兩種名字都留著。
  # ---------------------------------------------------------------------
  - model_name: deepseek-chat
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY
    model_info:
      supports_function_calling: true
      supports_vision: false
      supports_reasoning: false

  - model_name: deepseek-reasoner
    litellm_params:
      model: deepseek/deepseek-reasoner
      api_key: os.environ/DEEPSEEK_API_KEY
    model_info:
      supports_function_calling: true
      supports_vision: false
      supports_reasoning: true

  - model_name: deepseek-v4-pro
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_key: os.environ/DEEPSEEK_API_KEY
    model_info:
      supports_function_calling: true
      supports_vision: false
      supports_reasoning: true

  # ---------------------------------------------------------------------
  # 遠端 Ollama（192.168.1.146:11434）
  # 以下是 2026-08-05 實際偵測到的模型清單，若對方機器有增減請自行更新。
  # Ollama 不需要 api_key。
  # model_info 是手動宣告的能力旗標：litellm 內建的模型資料庫不認得本機模型，
  # 不宣告的話 /model/info 一律回報 None（未知）。換模型時記得跟著改。
  # ---------------------------------------------------------------------
  - model_name: ollama-qwen3-32b
    litellm_params:
      model: ollama/qwen3:32b
      api_base: http://192.168.1.146:11434
    model_info:
      supports_function_calling: true
      supports_vision: false
      supports_reasoning: true

  - model_name: ollama-qwen2.5-14b
    litellm_params:
      model: ollama/qwen2.5:14b-instruct-q4_K_M
      api_base: http://192.168.1.146:11434
    model_info:
      supports_function_calling: true
      supports_vision: false
      supports_reasoning: false

  - model_name: ollama-deepseek-r1-8b
    litellm_params:
      model: ollama/deepseek-r1:8b
      api_base: http://192.168.1.146:11434
    model_info:
      supports_function_calling: false
      supports_vision: false
      supports_reasoning: true

  - model_name: ollama-gemma3-1b
    litellm_params:
      model: ollama/gemma3:1b
      api_base: http://192.168.1.146:11434
    model_info:
      supports_function_calling: false
      supports_vision: false
      supports_reasoning: false

  # ---------------------------------------------------------------------
  # 本機 LM Studio
  # LM Studio 會在 http://localhost:1234/v1 提供 OpenAI 相容的端點，
  # api_key 只是佔位用的假值，LM Studio 本身不會驗證它。
  # 下面的 model id 是本機真的下載好的三個（LM Studio 的 Local Server 分頁，
  # 或 curl http://localhost:1234/v1/models 可以確認）。
  # 三個都有 mmproj 檔，所以是看得到圖的。
  # LM Studio 沒載入模型時，第一次呼叫會由它自己 JIT 載入，會慢一下。
  # ---------------------------------------------------------------------
  - model_name: lm-gemma-4-12b
    litellm_params:
      model: lm_studio/google/gemma-4-12b-qat
      api_base: http://localhost:1234/v1
      api_key: lm-studio-dummy-key
    model_info:
      supports_function_calling: true
      supports_vision: true
      supports_reasoning: true

  - model_name: lm-gemma-4-e4b
    litellm_params:
      model: lm_studio/google/gemma-4-e4b
      api_base: http://localhost:1234/v1
      api_key: lm-studio-dummy-key
    model_info:
      supports_function_calling: true
      supports_vision: true
      supports_reasoning: true

  - model_name: lm-qwen3.5-9b
    litellm_params:
      model: lm_studio/qwen/qwen3.5-9b
      api_base: http://localhost:1234/v1
      api_key: lm-studio-dummy-key
    model_info:
      supports_function_calling: true
      supports_vision: true
      supports_reasoning: true

# 若要啟用 master key 驗證，請設定環境變數 LITELLM_MASTER_KEY，
# 並取消下一行的註解（同時取消 general_settings: 這個區塊標籤的註解）。
# 若保持整段註解狀態，即使沒有設定該環境變數，proxy 仍然可以正常啟動，
# 不會因為變數不存在而啟動失敗。
# general_settings:
#   master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  # 遇到不支援的參數時，直接丟棄而不是丟出錯誤，增加相容性
  drop_params: true
  # API 呼叫失敗時的重試次數，設定保守一點避免過度重試
  num_retries: 2
  # 單一請求的逾時秒數（本機模型或大型推理模型可能需要較長時間）
  request_timeout: 600
